# Pikado, served as static files.
#
# The cache headers below are the whole reason this file exists rather than
# nginx's default. Pikado ships a service worker that caches /assets/ with a
# cache-first strategy, on the grounds that Vite puts a content hash in every
# asset filename — so those bytes genuinely never change and may be cached
# forever. The two files that must NOT be cached are the ones that name
# everything else: the shell, and the worker itself. Get those wrong and a
# browser holding an old copy keeps asking for asset hashes the server no
# longer has, which is a blank page that reloading cannot fix.

server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # nginx's bundled mime.types is missing this one, and a manifest served as
    # text/plain is silently ignored, which costs the install prompt.
    types {
        application/manifest+json  webmanifest;
    }
    include /etc/nginx/mime.types;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/javascript application/json
                      application/manifest+json image/svg+xml;

    # Content-hashed, therefore immutable. A new build emits new filenames.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # The worker decides what every future visit loads, so a stale one is the
    # one thing that cannot be allowed to persist. Always revalidate.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    # The shell names the hashed assets, so it is revalidated on every load.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache" always;
    }

    # Pikado has no client-side router — it is one page — but falling back to
    # the shell keeps a stray deep link or a refresh from returning a bare 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Not a page, and not worth a log line each time a browser asks.
    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }
}
